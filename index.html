<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>For Ardan ❤️</title>

    <!-- Font Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aldrich&family=Patrick+Hand&family=Pixelify+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --bg-color: #fce4ec;
        --box-color: #d32f2f;
        --ribbon-color: #ffca28;
        --letter-bg: #fffdf5;
        --text-color: #4a4a4a;
        --accent-color: #ff80ab;
        --success-color: #4caf50;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--bg-color);
        background-image: radial-gradient(#f8bbd0 2px, transparent 2px);
        background-size: 30px 30px;
        font-family: "Aldrich", sans-serif;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        perspective: 1000px;
      }

      /* Music Control */
      .music-control {
        position: fixed; top: 20px; right: 20px;
        background: white; width: 50px; height: 50px; border-radius: 50%;
        display: flex; justify-content: center; align-items: center;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000; cursor: pointer;
        border: 2px solid var(--box-color);
        animation: spin 4s linear infinite; animation-play-state: paused;
      }
      .music-control.playing { animation-play-state: running; }
      @keyframes spin { 100% { transform: rotate(360deg); } }

      /* Gift Cube */
      #gift-scene { width: 150px; height: 150px; perspective: 1000px; position: relative; z-index: 10; cursor: pointer; transition: opacity 0.5s ease, transform 0.5s ease; }
      .cube { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transform: rotateX(-20deg) rotateY(45deg); animation: rotateBox 6s infinite linear; transition: transform 1s ease; }
      #gift-scene:hover .cube, .cube.stop-rotate { animation-play-state: paused; transform: rotateX(-10deg) rotateY(30deg) scale(1.1); }
      .face { position: absolute; width: 150px; height: 150px; background: var(--box-color); border: 2px solid #b71c1c; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.1); }
      .face::after { content: ''; position: absolute; width: 30px; height: 100%; background: var(--ribbon-color); left: 60px; top: 0; }
      .face::before { content: ''; position: absolute; height: 30px; width: 100%; background: var(--ribbon-color); top: 60px; left: 0; }
      .front  { transform: translateZ(75px); }
      .back   { transform: rotateY(180deg) translateZ(75px); }
      .right  { transform: rotateY(90deg) translateZ(75px); }
      .left   { transform: rotateY(-90deg) translateZ(75px); }
      .bottom { transform: rotateX(-90deg) translateZ(75px); box-shadow: 0 0 50px rgba(0,0,0,0.5); }
      .lid { position: absolute; width: 160px; height: 160px; background: #e53935; top: -5px; left: -5px; transform: translateZ(75px) rotateX(0deg); transform-origin: top; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); border: 2px solid #b71c1c; display: flex; justify-content: center; align-items: center; }
      .lid::after { content: ''; position: absolute; width: 30px; height: 100%; background: var(--ribbon-color); left: 65px; top: 0; }
      .lid::before { content: ''; height: 30px; width: 100%; background: var(--ribbon-color); top: 65px; left: 0; }
      .bow { position: absolute; top: -40px; font-size: 50px; color: var(--ribbon-color); filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); z-index: 5; transition: transform 0.8s ease; }

      @keyframes rotateBox { 0% { transform: rotateX(-20deg) rotateY(0deg); } 100% { transform: rotateX(-20deg) rotateY(360deg); } }

      /* Bouquet */
      #bouquet-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 200px; height: 250px; z-index: 15; cursor: pointer; opacity: 0; transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55); display: flex; flex-direction: column; align-items: center; }
      .bouquet-paper { position: absolute; bottom: 0; width: 180px; height: 180px; background: linear-gradient(135deg, #ff80ab, #f50057); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%); z-index: 1; }
      .bouquet-paper::after { content: ''; position: absolute; top:0; left:0; right:0; bottom:0; background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%); }
      .bouquet-flowers { position: absolute; top: 20px; z-index: 2; display: flex; justify-content: center; width: 100%; }
      .flower { position: absolute; font-size: 3rem; transition: transform 0.3s; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
      .f1 { left: 50%; transform: translateX(-50%) translateY(-20px) rotate(-10deg); z-index: 5; font-size: 3.5rem;} 
      .f2 { left: 20%; transform: translateY(-10px) rotate(-25deg); z-index: 3; }
      .f3 { left: 80%; transform: translateY(-10px) rotate(25deg); z-index: 3; }
      .f4 { left: 35%; transform: translateY(0px) rotate(-5deg); z-index: 4; font-size: 2.5rem;}
      .f5 { left: 65%; transform: translateY(0px) rotate(5deg); z-index: 4; font-size: 2.5rem;}
      .f6 { left: 10%; transform: translateY(10px) rotate(-30deg); z-index: 2; font-size: 2rem;}
      .f7 { left: 90%; transform: translateY(10px) rotate(30deg); z-index: 2; font-size: 2rem;}
      .big-bow { position: absolute; bottom: 40px; z-index: 3; font-size: 4rem; color: var(--ribbon-color); filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
      
      /* Letter */
      #letter-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) translateY(20px); width: 90vw; max-width: 400px; max-height: 85vh; background: var(--letter-bg); border-radius: 10px; padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; opacity: 0; pointer-events: none; transition: all 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55); z-index: 1; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #e0e0e0; }
      body.box-opened #gift-scene { opacity: 0; pointer-events: none; transform: scale(0.5); }
      body.box-opened #bouquet-container { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      body.show-letter #bouquet-container { opacity: 0; transform: translate(-50%, -50%) scale(0.5); pointer-events: none; }
      body.show-letter #letter-container { opacity: 1; transform: translate(-50%, -50%) translateY(0); pointer-events: all; z-index: 20; overflow-y: auto; }
    </style>
  </head>
  <body>
    <!-- Musik -->
    <audio id="bg-music" loop>
      <source src="lagu.mp3" type="audio/mpeg">
    </audio>
    <div class="music-control" id="music-btn" onclick="toggleMusic()">
      <i class="fas fa-music"></i>
    </div>

    <!-- Kado -->
    <div id="gift-scene">
      <div class="cube" id="cube">
        <div class="face front"></div>
        <div class="face back"></div>
        <div class="face right"></div>
        <div class="face left"></div>
        <div class="face bottom"></div>
        <div class="lid"><div class="bow">🎀</div></div>
      </div>
      <p class="hint-text">Klik Kadonya!</p>
    </div>

    <!-- Buket -->
    <div id="bouquet-container">
      <div class="bouquet-flowers">
        <div class="flower f1">🌹</div>
        <div class="flower f2">🌹</div>
        <div class="flower f3">🌸</div>
        <div class="flower f4">🌹</div>
        <div class="flower f5">🌷</div>
        <div class="flower f6">🌿</div>
        <div class="flower f7">🌿</div>
      </div>
      <div class="bouquet-paper"></div>
      <div class="big-bow">🎀</div>
      <p class="hint-text" style="color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.5);">Klik Buket!</p>
    </div>

    <!-- Surat -->
    <div id="letter-container">
      <div id="proposal-view">
        <h1>Will you be<br>my Valentine, Ardan?</h1>
        <div class="cat-gif"><i class="fas fa-cat"></i></div>
        <div class="buttons" id="letter-buttons">
          <button class="btn yes-btn" id="yesBtn">Yes! <i class="fas fa-check"></i></button>
          <button class="btn no-btn" id="noBtn">No</button>
        </div>
      </div>

      <div id="full-letter">
        <div class="letter-header">
          <div class="letter-title">Yeay! 😻</div>
          <small style="color: #888;">MALUUU NYAAAAA!</small>
        </div>
        <div class="photo-gallery">
          <div class="photo-slot"><img src="foto 1.jpeg" alt="Foto1"></div>
          <div class="photo-slot"><img src="foto 2.jpeg" alt="Foto2"></div>
          <div class="photo-slot"><img src="foto 3.jpeg" alt="Foto3"></div>
        </div>
        <div class="letter-body" id="typewriter-text"></div>
        <div class="signature">
          With Love,<br>
          <strong>(anak lpg)</strong>
        </div>
      </div>
    </div>

    <script>
      // Script sama persis seperti versi FINAL sebelumnya
      // (Fade-in musik, klik kado → buket → surat, tombol No lari, Yes confetti + typewriter)
      // Copy paste script.js yang sudah aku tulis di jawaban sebelumnya
    </script>
  </body>
</html>
